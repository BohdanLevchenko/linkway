name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        run: |
          version="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)"
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Info.plist version $version" >&2
            exit 1
          fi
      - name: Test
        run: swift test
      - name: Assemble app
        run: scripts/bundle.sh
      - name: Package
        run: ditto -c -k --keepParent build/Linkway.app "Linkway-$GITHUB_REF_NAME.zip"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Linkway-$GITHUB_REF_NAME.zip" --verify-tag --generate-notes
